# .github/workflows/slop-check.yml — for apps on GitHub built with your own CI (or by hand)
# instead of Slop Build. When you publish a release, SLAPorSLOP's malware scan of every file, its
# source check and Microsoft Defender (Windows files) run here and tell SLAPorSLOP. Builds from
# Slop Build are checked already and don't need it.
name: Slop Check
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check
jobs:
  check:
    uses: DocFoxHound/slop-build/.github/workflows/check.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ inputs.tag }}
      app: your-app
      slop-url: https://slaporslop.games
