# Slop Build: the shared build recipe (docs/ARCHITECTURE.md §6.2, docs/SECURITY.md §5.1).
#
# Makers call this reusable workflow from a ~15-line file in their repo (see examples/). It runs
# on the maker's own GitHub Actions minutes and:
#   1. builds the app for each platform on GitHub-hosted runners,
#   2. Windows: signs the program with the maker's free SignPath Foundation certificate, if they
#      have one (optional), then checks the build with Microsoft Defender, today's definitions,
#      so Slop knows before publishing whether players' Windows would stop it,
#   3. packs each build (Windows: a .zip; Linux: a .tar.gz plus .deb and .rpm packages) and
#      signs every file with a GitHub artifact attestation (Sigstore), which records that this
#      recipe built it from the maker's repo at this commit,
#   4. checks the source for leaked secrets (gitleaks) and dependencies with known
#      vulnerabilities (OSV-Scanner),
#   5. attaches the files to a release on the maker's repo (Slop stores no builds),
#   6. tells Slop, using the run's GitHub OIDC token instead of any secret.
#
# Project types: rust, go, godot (the project's export presets), python (PyInstaller), electron
# (electron-builder, unpacked), tauri (no bundle), web (the built site in a small Tauri window),
# and custom (any build command). With publish: false it builds and checks only.
#
# This recipe is trusted by every app built with it. Changes need two-person review, releases are
# tagged, and makers pin a tag (SECURITY §5.1). It never handles Slop secrets.

name: Slop Build

on:
  workflow_call:
    inputs:
      app:
        description: The app's address on Slop (its slug).
        required: true
        type: string
      slop-url:
        description: The Slop site, e.g. https://slop.example
        required: true
        type: string
      project-type:
        description: rust, go, dotnet, godot, unity, web, electron, tauri, python or custom.
        required: true
        type: string
      platforms:
        description: Comma-separated platforms to build, from windows and linux.
        required: false
        type: string
        default: windows,linux
      linux-packages:
        description: >-
          Comma-separated Linux packages to make besides the .tar.gz, from deb and rpm. Slop uses
          the ones your store page lists and ignores the rest.
        required: false
        type: string
        default: deb,rpm
      build-command:
        description: "custom only: the command that builds the app (run with bash)."
        required: false
        type: string
        default: ""
      output-dir:
        description: "custom only: the folder the build command produces."
        required: false
        type: string
        default: ""
      sign:
        description: >-
          Sign each build with a GitHub artifact attestation (the maker's signature Slop requires).
          Attestations in private repositories need GitHub Enterprise Cloud, so private test
          setups turn this off and run Slop with SLOP_REQUIRE_MAKER_SIGNATURE=false.
        required: false
        type: boolean
        default: true
      exec:
        description: >-
          The program to start, relative to the build. "{ext}" becomes .exe on Windows. Needed
          for custom; worked out automatically for every other type (set it to override).
        required: false
        type: string
        default: ""
      project-path:
        description: Where the project is in the repository (godot, electron, tauri, python, web).
        required: false
        type: string
        default: "."
      godot-version:
        description: "godot only: the Godot version, e.g. 4.3 or 4.4.1 (standard, not .NET)."
        required: false
        type: string
        default: "4.3"
      godot-dotnet:
        description: "godot only: the project uses C# (Godot's .NET build)."
        required: false
        type: boolean
        default: false
      dotnet-version:
        description: "dotnet, and godot with godot-dotnet: the .NET SDK version."
        required: false
        type: string
        default: "8.0.x"
      dotnet-project:
        description: >-
          dotnet only: the project to publish (a .csproj), relative to project-path. Found
          automatically when there's one program project.
        required: false
        type: string
        default: ""
      godot-preset-windows:
        description: "godot only: the export preset for Windows (export_presets.cfg)."
        required: false
        type: string
        default: Windows Desktop
      godot-preset-linux:
        description: "godot only: the export preset for Linux (export_presets.cfg)."
        required: false
        type: string
        default: Linux
      python-version:
        description: "python only: the Python version."
        required: false
        type: string
        default: "3.12"
      python-entry:
        description: "python only: the script that starts the app, relative to project-path."
        required: false
        type: string
        default: main.py
      python-windowed:
        description: "python only: no console window (for apps with their own window, e.g. pygame)."
        required: false
        type: boolean
        default: false
      node-version:
        description: Node.js version (electron, tauri, and web when it has a package.json).
        required: false
        type: string
        default: "22"
      publish:
        description: >-
          false builds and checks only: no release, nothing sent to Slop. For trying a build
          (the files are kept as the run's artifacts for a day).
        required: false
        type: boolean
        default: true
      linux-runtime:
        description: >-
          Optional: "steam-sniper" builds the Linux program inside Valve's Steam Runtime 3 (sniper)
          SDK, so it runs on older Linux systems too (glibc 2.31 and newer). For rust, go and custom
          builds; leave empty to build on the runner's Ubuntu.
        required: false
        type: string
        default: ""
      itch-target:
        description: >-
          Optional: also publish each build to your itch.io page, as "user/game" (from the page's
          address, user.itch.io/game). Windows and Linux go to the windows and linux channels with
          itch's own tool (butler). Needs the BUTLER_API_KEY secret.
        required: false
        type: string
        default: ""
      flatpak-app-id:
        description: >-
          Optional: a Flatpak app ID, e.g. io.github.you.Game, to attach a draft Flatpak manifest
          for the Linux build to each release, for you to finish and submit to Flathub.
        required: false
        type: string
        default: ""
      signpath-organization-id:
        description: >-
          Optional: your SignPath organization ID, to sign the Windows program with a free
          SignPath Foundation certificate for open-source projects (signpath.org). Signed programs
          are far less likely to be stopped by Windows. Needs the SIGNPATH_API_TOKEN secret.
        required: false
        type: string
        default: ""
      signpath-project-slug:
        description: Your SignPath project's slug (defaults to the app's Slop address).
        required: false
        type: string
        default: ""
      signpath-signing-policy-slug:
        description: Your SignPath signing policy's slug.
        required: false
        type: string
        default: release-signing
    secrets:
      BUTLER_API_KEY:
        description: Your itch.io API key (itch.io → Settings → API keys), only with itch-target.
        required: false
      SIGNPATH_API_TOKEN:
        description: Your SignPath CI user's API token (only with signpath-organization-id).
        required: false
      UNITY_LICENSE:
        description: "unity: the contents of your Unity licence file (.ulf). Unity's licence, kept in your repository's secrets."
        required: false
      UNITY_EMAIL:
        description: "unity: your Unity account's email."
        required: false
      UNITY_PASSWORD:
        description: "unity: your Unity account's password."
        required: false
      UNITY_SERIAL:
        description: "unity: a Plus or Pro serial, instead of UNITY_LICENSE."
        required: false

permissions: {}

concurrency:
  # One build at a time per app and branch (a repository can hold several apps).
  group: slop-build-${{ github.repository }}-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check inputs
        env:
          APP: ${{ inputs.app }}
          TYPE: ${{ inputs.project-type }}
          SLOP_URL: ${{ inputs.slop-url }}
          LINUX_RUNTIME: ${{ inputs.linux-runtime }}
        run: |
          [[ "$LINUX_RUNTIME" =~ ^(|steam-sniper)$ ]] || { echo "::error::linux-runtime is empty or steam-sniper"; exit 1; }
          if [ -n "$LINUX_RUNTIME" ] && ! [[ "$TYPE" =~ ^(rust|go|custom)$ ]]; then
            echo "::error::linux-runtime works with rust, go and custom builds"; exit 1; fi
          [[ "$APP" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::app must be your app's Slop address, e.g. my-game"; exit 1; }
          [[ "$TYPE" =~ ^(rust|go|dotnet|godot|unity|web|electron|tauri|python|custom)$ ]] || { echo "::error::project-type must be rust, go, dotnet, godot, unity, web, electron, tauri, python or custom"; exit 1; }
          [[ "$SLOP_URL" =~ ^https?://[^/]+/?$ ]] || { echo "::error::slop-url must be a site address like https://slop.example"; exit 1; }

      - name: Choose version and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # A tag push builds that tag; anything else gets a numbered build release.
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"; version="${REF_NAME#v}"
          else
            tag="slop-build-$RUN"; version="build.$RUN"
          fi
          if [ "$PUBLISH" != "true" ]; then
            echo "Build and check only: no release."
          elif ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$version" --notes "Built by Slop Build from ${GITHUB_SHA}."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Choose platforms
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {"windows": "windows-latest", "linux": "ubuntu-latest"}
          wanted = [p.strip() for p in os.environ["PLATFORMS"].split(",") if p.strip()]
          bad = [p for p in wanted if p not in runners]
          if bad or not wanted:
              raise SystemExit(f"::error::unknown platforms: {bad}")
          print("matrix=" + json.dumps({"include": [{"platform": p, "runner": runners[p]} for p in wanted]}))
          PY

  # Unity, through GameCI's builder (Docker, on Linux), for every requested platform. The
  # licence is the maker's, from their own repository's secrets; Slop never sees it.
  unity:
    name: Build with Unity (${{ matrix.platform }})
    needs: prepare
    if: inputs.project-type == 'unity'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true

      - name: Check the Unity licence
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_LOGIN: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          if [ "$HAS_LICENSE" != "true" ] && [ "$HAS_SERIAL" != "true" ]; then
            echo "::error::Unity needs a licence to build: add UNITY_LICENSE (Personal) or UNITY_SERIAL (Plus/Pro) to your repository's secrets. See the Unity section of the publishing guide."
            exit 1
          fi
          if [ "$HAS_LOGIN" != "true" ]; then
            echo "::error::Unity also needs UNITY_EMAIL and UNITY_PASSWORD in your repository's secrets."
            exit 1
          fi

      # Unity's editor image is large: make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null || true
          df -h /

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: slop-unity-${{ matrix.platform }}-${{ hashFiles(format('{0}/Assets/**', inputs.project-path), format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}
          restore-keys: slop-unity-${{ matrix.platform }}-

      - name: Build
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ inputs.project-path }}
          targetPlatform: ${{ matrix.platform == 'windows' && 'StandaloneWindows64' || 'StandaloneLinux64' }}
          buildName: ${{ inputs.app }}
          buildsPath: slop-unity

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slop-unity-${{ matrix.platform }}
          path: slop-unity/${{ matrix.platform == 'windows' && 'StandaloneWindows64' || 'StandaloneLinux64' }}
          retention-days: 1

  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare, unity]
    # Unity's job is skipped for every other type.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.unity.result == 'success' || needs.unity.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # The maker's own code runs in this job (build scripts, npm scripts, custom commands), so it
    # gets no token that could speak for the recipe: no id-token, read-only contents. It hands the
    # built folder to the release job, which signs, checks and publishes it on a fresh runner.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        if: inputs.project-type == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Get the Unity build
        if: inputs.project-type == 'unity'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slop-unity-${{ matrix.platform }}
          path: slop-dist/unity

      - name: Set up .NET
        if: inputs.project-type == 'dotnet' || (inputs.project-type == 'godot' && inputs.godot-dotnet)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up Python
        if: inputs.project-type == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node.js
        if: inputs.project-type == 'electron' || inputs.project-type == 'tauri' || inputs.project-type == 'web'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      # Tauri, and the web shell (which is a small Tauri app), use the system's web view: WebKitGTK
      # on Linux. Players' packages depend on it (see the Linux packages step).
      - name: Linux libraries for a web view
        if: matrix.platform == 'linux' && (inputs.project-type == 'tauri' || inputs.project-type == 'web')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
          echo "SLOP_DEB_DEPENDS=libwebkit2gtk-4.1-0, libgtk-3-0" >> "$GITHUB_ENV"
          echo "SLOP_RPM_REQUIRES=webkit2gtk4.1, gtk3" >> "$GITHUB_ENV"

      - name: Cache Rust builds
        if: inputs.project-type == 'rust' || inputs.project-type == 'tauri' || inputs.project-type == 'web'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ${{ inputs.project-path }}/src-tauri/target
            ${{ runner.temp }}/slop-web-shell/target
          key: slop-build-${{ matrix.platform }}-${{ inputs.project-type }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: slop-build-${{ matrix.platform }}-${{ inputs.project-type }}-

      - name: Set up Godot
        if: inputs.project-type == 'godot'
        env:
          GODOT: ${{ inputs.godot-version }}
          PLATFORM: ${{ matrix.platform }}
          DOTNET: ${{ inputs.godot-dotnet }}
        run: |
          ver="${GODOT%-stable}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::godot-version must look like 4.3 or 4.4.1"; exit 1; }
          base="https://github.com/godotengine/godot/releases/download/${ver}-stable"
          tools="$RUNNER_TEMP/godot"; mkdir -p "$tools"
          # C# projects need Godot's .NET build ("mono"), with its own templates.
          mono=""; tpl="${ver}.stable"
          if [ "$DOTNET" = "true" ]; then mono="_mono"; tpl="${ver}.stable.mono"; fi
          if [ "$PLATFORM" = "windows" ]; then
            if [ -n "$mono" ]; then file="Godot_v${ver}-stable_mono_win64.zip"; else file="Godot_v${ver}-stable_win64.exe.zip"; fi
            templates="$APPDATA/Godot/export_templates/$tpl"
          else
            if [ -n "$mono" ]; then file="Godot_v${ver}-stable_mono_linux_x86_64.zip"; else file="Godot_v${ver}-stable_linux.x86_64.zip"; fi
            templates="$HOME/.local/share/godot/export_templates/$tpl"
          fi
          curl -sSfL -o "$tools/godot.zip" "$base/$file"
          (cd "$tools" && unzip -q godot.zip && rm godot.zip)
          if [ "$PLATFORM" = "windows" ]; then
            bin=$(find "$tools" -name '*_console.exe' | head -n 1)
          else
            bin=$(find "$tools" -type f -name 'Godot_v*_linux*.x86_64' | head -n 1); chmod +x "$bin"
          fi
          [ -n "$bin" ] || { echo "::error::couldn't find Godot in $file"; exit 1; }
          curl -sSfL -o "$tools/templates.tpz" "$base/Godot_v${ver}-stable${mono}_export_templates.tpz"
          mkdir -p "$templates"
          (cd "$tools" && unzip -q templates.tpz && cp -R templates/. "$templates/")
          echo "SLOP_GODOT=$bin" >> "$GITHUB_ENV"

      - name: Build
        env:
          TYPE: ${{ inputs.project-type }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
          EXEC: ${{ inputs.exec }}
          REPO_NAME: ${{ github.event.repository.name }}
          APP: ${{ inputs.app }}
          PROJECT: ${{ inputs.project-path }}
          PRESET_WINDOWS: ${{ inputs.godot-preset-windows }}
          PRESET_LINUX: ${{ inputs.godot-preset-linux }}
          PY_ENTRY: ${{ inputs.python-entry }}
          DOTNET_PROJECT: ${{ inputs.dotnet-project }}
          GODOT_DOTNET: ${{ inputs.godot-dotnet }}
          PY_WINDOWED: ${{ inputs.python-windowed }}
          LINUX_RUNTIME: ${{ inputs.linux-runtime }}
        run: |
          ext=""; [ "$PLATFORM" = "windows" ] && ext=".exe"
          out="$PWD/slop-dist/app"
          mkdir -p "$out"
          # Valve's Steam Runtime 3 (sniper) SDK, pinned to the version and image Slop tested
          # (examples/slop-pong's tests pass in it). Moving it is a change to this recipe.
          SNIPER_SDK=registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20260928.262393@sha256:9ae8083ee9ae6298361a62f289e62f0a2b0779d23fc8c276304157f0c06010c5
          # Runs a compile command here, or for Linux with linux-runtime inside the Steam Runtime
          # SDK, with the repository at the same path, as this user, and extra mounts from $@.
          compile() {
            local cmd="$1"; shift
            if [ "$PLATFORM" != "linux" ] || [ -z "$LINUX_RUNTIME" ]; then
              bash -euo pipefail -c "$cmd"; return
            fi
            mkdir -p "$RUNNER_TEMP/slop-runtime-home"
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/slop-home \
              -v "$RUNNER_TEMP/slop-runtime-home:/slop-home" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              -w "$PWD" "$@" "$SNIPER_SDK" \
              bash -euo pipefail -c "$cmd"
          }
          # A program inside a folder, for types whose output has one (Electron, PyInstaller).
          find_program() {
            python3 - "$1" "$PLATFORM" <<'PY'
          import os, sys
          root, platform = sys.argv[1], sys.argv[2]
          skip = ("uninstall", "chrome-sandbox", "chrome_crashpad_handler", "crashpad_handler")
          found = []
          for name in os.listdir(root):
              path = os.path.join(root, name)
              if not os.path.isfile(path) or name.lower().startswith(skip):
                  continue
              with open(path, "rb") as fh:
                  magic = fh.read(4)
              if (platform == "windows" and name.lower().endswith(".exe")) or (platform != "windows" and magic == b"\x7fELF" and os.access(path, os.X_OK)):
                  found.append((os.path.getsize(path), name))
          if not found:
              raise SystemExit(f"::error::no program found in {root}; set exec")
          print(max(found)[1])
          PY
          }
          case "$TYPE" in
            rust)
              if [ "$PLATFORM" = "linux" ] && [ -n "$LINUX_RUNTIME" ]; then
                # The runner's Rust needs a newer glibc, so the SDK gets its own (rust-toolchain.toml is honoured).
                compile 'curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal; . "$HOME/.cargo/env"; cargo build --release --locked'
              else
                cargo build --release --locked
              fi
              # The first binary target of the workspace's packages.
              name=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          meta = json.load(sys.stdin)
          bins = [t["name"] for p in meta["packages"] for t in p["targets"] if "bin" in t["kind"]]
          if not bins: raise SystemExit("no binary target in Cargo.toml")
          print(bins[0])')
              cp "target/release/$name$ext" "$out/"
              exec="$name$ext"
              ;;
            go)
              # Go's own tools don't need the system's libraries, so the runner's work in the SDK too.
              export SLOP_OUT="$out/$REPO_NAME$ext" GOROOT="$(go env GOROOT)"
              compile 'PATH="$GOROOT/bin:$PATH" go build -trimpath -o "$SLOP_OUT" .' \
                -e SLOP_OUT -e GOROOT -e GOCACHE=/slop-home/go-cache -e GOMODCACHE=/slop-home/go-mod \
                -v "$GOROOT:$GOROOT:ro"
              exec="$REPO_NAME$ext"
              ;;
            dotnet)
              cd "$PROJECT"
              # The program project: the one given, or the only one whose OutputType is Exe or WinExe.
              proj="$DOTNET_PROJECT"
              if [ -z "$proj" ]; then
                proj=$(python3 - <<'PY'
          import pathlib, re, sys
          found = [p for p in pathlib.Path(".").rglob("*.csproj")
                   if "/bin/" not in str(p) and "/obj/" not in str(p)
                   and re.search(r"<OutputType>\s*(Exe|WinExe)\s*</OutputType>", p.read_text(errors="ignore"), re.I)]
          if len(found) != 1:
              raise SystemExit(f"::error::found {len(found)} program projects ({', '.join(map(str, found)) or 'none'}): set dotnet-project")
          print(found[0])
          PY
                )
              fi
              [ -f "$proj" ] || { echo "::error::no $proj in $PROJECT"; exit 1; }
              # Tools a project declares (e.g. MonoGame's content builder).
              [ -f .config/dotnet-tools.json ] && dotnet tool restore
              rid=linux-x64; [ "$PLATFORM" = "windows" ] && rid=win-x64
              # Self-contained: players don't need .NET installed.
              dotnet publish "$proj" -c Release -r "$rid" --self-contained true -p:PublishSingleFile=false -o "$out"
              name=$(python3 - "$proj" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          m = re.search(r"<AssemblyName>\s*([^<]+?)\s*</AssemblyName>", p.read_text(errors="ignore"))
          print(m.group(1) if m else p.stem)
          PY
              )
              exec="$name$ext"
              ;;
            unity)
              cp -R slop-dist/unity/. "$out/"
              # Unity names the player after buildName (the app's address).
              if [ -f "$out/$APP$ext" ]; then exec="$APP$ext"; else exec=$(find_program "$out"); fi
              ;;
            godot)
              cd "$PROJECT"
              [ -f project.godot ] || { echo "::error::no project.godot in $PROJECT (set project-path)"; exit 1; }
              preset="$PRESET_LINUX"; [ "$PLATFORM" = "windows" ] && preset="$PRESET_WINDOWS"
              grep -q "^name=\"$preset\"" export_presets.cfg 2>/dev/null || {
                echo "::error::export_presets.cfg has no preset named \"$preset\": in Godot, open Project → Export, add it, and commit export_presets.cfg"; exit 1; }
              # C#: build the scripts first, as the editor does before exporting.
              if [ "$GODOT_DOTNET" = "true" ]; then
                csproj=$(ls *.csproj 2>/dev/null | head -n 1)
                [ -n "$csproj" ] || { echo "::error::godot-dotnet is on but there's no .csproj next to project.godot"; exit 1; }
                dotnet build "$csproj" -c ExportRelease >/dev/null || dotnet build "$csproj" -c Release
              fi
              # Import once, so a clean checkout exports like the editor does.
              "$SLOP_GODOT" --headless --import >/dev/null 2>&1 || true
              "$SLOP_GODOT" --headless --export-release "$preset" "$out/$REPO_NAME$ext"
              exec="$REPO_NAME$ext"
              ;;
            python)
              cd "$PROJECT"
              [ -f "$PY_ENTRY" ] || { echo "::error::no $PY_ENTRY in $PROJECT (set python-entry)"; exit 1; }
              python -m pip install --quiet --upgrade pip
              [ -f requirements.txt ] && python -m pip install --quiet -r requirements.txt
              python -m pip install --quiet "pyinstaller==6.11.1"
              windowed=""; [ "$PY_WINDOWED" = "true" ] && windowed="--windowed"
              python -m PyInstaller --noconfirm --clean --onedir $windowed --name "$REPO_NAME" --distpath "$RUNNER_TEMP/pyi" "$PY_ENTRY"
              cp -R "$RUNNER_TEMP/pyi/$REPO_NAME"/. "$out/"
              exec="$REPO_NAME$ext"
              ;;
            electron)
              cd "$PROJECT"
              [ -f package.json ] || { echo "::error::no package.json in $PROJECT (set project-path)"; exit 1; }
              npm ci
              [ -n "$BUILD_COMMAND" ] && bash -euo pipefail -c "$BUILD_COMMAND"
              # An unpacked folder (no installer): Slop installs and updates it.
              npx --yes electron-builder@25 --dir --publish never
              unpacked=dist/linux-unpacked; [ "$PLATFORM" = "windows" ] && unpacked=dist/win-unpacked
              [ -d "$unpacked" ] || { echo "::error::electron-builder made no $unpacked"; exit 1; }
              cp -R "$unpacked"/. "$out/"
              exec=$(find_program "$out")
              ;;
            tauri)
              cd "$PROJECT"
              [ -d src-tauri ] || { echo "::error::no src-tauri folder in $PROJECT (set project-path)"; exit 1; }
              [ -f package.json ] && npm ci
              [ -n "$BUILD_COMMAND" ] && bash -euo pipefail -c "$BUILD_COMMAND"
              # The program only: Tauri builds its web assets in, and Slop installs it.
              if [ -f package.json ] && npm ls @tauri-apps/cli >/dev/null 2>&1; then
                npx tauri build --no-bundle
              else
                npx --yes @tauri-apps/cli@2 build --no-bundle
              fi
              name=$(cd src-tauri && cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          meta = json.load(sys.stdin)
          bins = [t["name"] for p in meta["packages"] for t in p["targets"] if "bin" in t["kind"]]
          if not bins: raise SystemExit("no binary in src-tauri/Cargo.toml")
          print(bins[0])')
              bin=$(ls src-tauri/target/release/"$name$ext" 2>/dev/null || true)
              [ -n "$bin" ] || bin=$(find_program src-tauri/target/release)
              cp "$bin" "$out/$APP$ext"
              exec="$APP$ext"
              ;;
            web)
              # A website (HTML5 game or app) in Slop's small Tauri shell: a window showing the
              # built site, nothing else. The site is built into the program.
              [ -n "$OUTPUT_DIR" ] || { echo "::error::web builds need output-dir: the folder with index.html"; exit 1; }
              (cd "$PROJECT" && { [ -f package.json ] && npm ci || true; } && { [ -z "$BUILD_COMMAND" ] || bash -euo pipefail -c "$BUILD_COMMAND"; })
              site="$PROJECT/$OUTPUT_DIR"
              [ -f "$site/index.html" ] || { echo "::error::$site has no index.html"; exit 1; }
              shell="$RUNNER_TEMP/slop-web-shell"
              mkdir -p "$shell/src" "$shell/icons"
              rm -rf "$shell/site" && cp -R "$site" "$shell/site"
              python3 - "$shell" "$APP" <<'PY'
          import json, os, struct, sys, zlib
          shell, app = sys.argv[1], sys.argv[2]
          title = app.replace("-", " ").title()
          crate = app.replace("-", "_")
          open(os.path.join(shell, "Cargo.toml"), "w").write(f"""[package]
          name = "{crate}"
          version = "0.1.0"
          edition = "2021"

          [[bin]]
          name = "{app}"
          path = "src/main.rs"

          [build-dependencies]
          tauri-build = {{ version = "2", features = [] }}

          [dependencies]
          tauri = {{ version = "2", features = ["custom-protocol"] }}

          [profile.release]
          strip = true
          lto = true
          """)
          open(os.path.join(shell, "build.rs"), "w").write("fn main() { tauri_build::build() }\n")
          open(os.path.join(shell, "src", "main.rs"), "w").write(
              '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]\n'
              "fn main() {\n    tauri::Builder::default()\n        .run(tauri::generate_context!())\n        .expect(\"the app couldn't start\");\n}\n")
          json.dump({
              "productName": title,
              "version": "0.1.0",
              "identifier": f"build.slop.{crate}",
              "build": {"frontendDist": "site"},
              "app": {"windows": [{"title": title, "width": 1280, "height": 800, "resizable": True}],
                      "security": {"csp": None}},
              "bundle": {"active": False, "icon": ["icons/icon.png", "icons/icon.ico"]},
          }, open(os.path.join(shell, "tauri.conf.json"), "w"), indent=2)
          # A plain icon (Windows needs one to build): Slop's green.
          def png(size):
              raw = b"".join(b"\x00" + bytes([0xA3, 0xE6, 0x35, 0xFF]) * size for _ in range(size))
              chunk = lambda t, d: struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          p = png(256)
          open(os.path.join(shell, "icons", "icon.png"), "wb").write(p)
          ico = struct.pack("<HHH", 0, 1, 1) + struct.pack("<BBBBHHII", 0, 0, 0, 0, 1, 32, len(p), 22) + p
          open(os.path.join(shell, "icons", "icon.ico"), "wb").write(ico)
          PY
              # The shell's own crates, at the versions this recipe was tested with.
              (cd "$shell" && cargo build --release)
              cp "$shell/target/release/$APP$ext" "$out/"
              exec="$APP$ext"
              ;;
            custom)
              [ -n "$BUILD_COMMAND" ] && [ -n "$OUTPUT_DIR" ] && [ -n "$EXEC" ] || {
                echo "::error::custom builds need build-command, output-dir and exec"; exit 1; }
              compile "$BUILD_COMMAND"
              cp -R "$OUTPUT_DIR"/. "$out/"
              exec="${EXEC//\{ext\}/$ext}"
              ;;
          esac
          cd "$GITHUB_WORKSPACE"
          # slop.toml (optional, at the top of the repository or the project): which program to
          # start and with what arguments, for every platform or per platform:
          #   [launch]                 [launch.windows]
          #   exec = "game{ext}"        exec = "Game.exe"
          #   args = ["--fullscreen"]   args = []
          # and the shared runtimes the Windows build needs, from Slop's list (Slop's /v1/runtimes):
          #   runtimes = ["vcredist-x64"]
          launch=$(python3 - "$PLATFORM" "$PROJECT" "$ext" <<'PY'
          import json, os, sys, tomllib
          platform, project, ext = sys.argv[1:4]
          cfg = {}
          for path in ("slop.toml", os.path.join(project, "slop.toml")):
              if os.path.isfile(path):
                  with open(path, "rb") as fh:
                      cfg = tomllib.load(fh)
                  break
          launch = cfg.get("launch", {})
          if not isinstance(launch, dict):
              raise SystemExit("::error::slop.toml: [launch] must be a table")
          own = launch.get(platform, {})
          exec_ = own.get("exec", launch.get("exec", ""))
          args = own.get("args", launch.get("args", []))
          if not isinstance(exec_, str) or not isinstance(args, list) or not all(isinstance(a, str) for a in args):
              raise SystemExit("::error::slop.toml: exec is a string and args a list of strings")
          if len(args) > 16 or any(len(a) > 200 for a in args):
              raise SystemExit("::error::slop.toml: at most 16 arguments of up to 200 characters")
          # None (not in slop.toml) keeps the last release's runtimes; [] says none.
          runtimes = cfg.get("runtimes")
          if runtimes is not None and (not isinstance(runtimes, list) or not all(isinstance(r, str) for r in runtimes)):
              raise SystemExit("::error::slop.toml: runtimes is a list of runtime IDs, e.g. [\"vcredist-x64\"]")
          print(json.dumps({"exec": exec_.replace("{ext}", ext), "args": args, "runtimes": runtimes}))
          PY
          )
          toml_exec=$(echo "$launch" | jq -r .exec)
          # The workflow's exec wins, then slop.toml's, then what the build type worked out.
          if [ -n "$EXEC" ] && [ "$TYPE" != "custom" ]; then exec="${EXEC//\{ext\}/$ext}";
          elif [ -n "$toml_exec" ] && [ -z "$EXEC" ]; then exec="$toml_exec"; fi
          case "$exec" in /*|*..*) echo "::error::the program must be inside the build: $exec"; exit 1;; esac
          [ -f "$out/$exec" ] || { echo "::error::the build has no $exec"; exit 1; }
          echo "SLOP_EXEC=$exec" >> "$GITHUB_ENV"
          echo "SLOP_ARGS=$(echo "$launch" | jq -c .args)" >> "$GITHUB_ENV"
          echo "SLOP_RUNTIMES=$(echo "$launch" | jq -c .runtimes)" >> "$GITHUB_ENV"

      # The release job sees only this archive and these settings, checked before they're used.
      - name: Hand the build over
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tar -cf slop-dist/app.tar -C slop-dist app
          jq -n --arg exec "$SLOP_EXEC" --argjson args "${SLOP_ARGS:-[]}" --argjson runtimes "${SLOP_RUNTIMES:-null}" \
            --arg deb "${SLOP_DEB_DEPENDS:-}" --arg rpm "${SLOP_RPM_REQUIRES:-}" \
            '{exec: $exec, args: $args, runtimes: $runtimes, deb_depends: $deb, rpm_requires: $rpm}' > slop-dist/build.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slop-built-${{ matrix.platform }}
          path: |
            slop-dist/app.tar
            slop-dist/build.json
          retention-days: 1

  release:
    name: Sign, check and publish (${{ matrix.platform }})
    needs: [prepare, build]
    # A fresh runner where no maker code has run: only it holds the OIDC token that speaks for the
    # recipe, signs attestations and attaches files, and Defender checks the files here.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slop-built-${{ matrix.platform }}
          path: slop-dist

      # The build's archive and settings came from the maker's code: check them before use. Paths
      # stay inside the folder, nothing but plain files, folders and links inside it, and settings
      # go into the environment only as validated single lines.
      - name: Take over the build
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tarfile
          with tarfile.open("slop-dist/app.tar") as t:
              for m in t.getmembers():
                  parts = m.name.split("/")
                  if m.name.startswith("/") or ".." in parts or parts[0] != "app":
                      raise SystemExit(f"::error::the build archive has an unexpected path: {m.name!r}")
                  if not (m.isfile() or m.isdir() or m.issym()):
                      raise SystemExit(f"::error::the build archive has a special file: {m.name!r}")
                  if m.issym() and (m.linkname.startswith("/") or ".." in m.linkname.split("/")):
                      raise SystemExit(f"::error::the build has a link out of its folder: {m.name!r}")
              try:
                  t.extractall("slop-dist", filter="data")
              except TypeError:  # Python before 3.12: the members were checked above
                  t.extractall("slop-dist")
          b = json.load(open("slop-dist/build.json"))
          line = re.compile(r"^[^\x00-\x1f\x7f]*$")
          exec_ = b.get("exec")
          if not isinstance(exec_, str) or not exec_ or not line.match(exec_) or exec_.startswith("/") or ".." in exec_.split("/"):
              raise SystemExit("::error::the build's program path isn't usable")
          for k in ("deb_depends", "rpm_requires"):
              if not re.match(r"^[A-Za-z0-9 ,.()<>=_+~:-]*$", b.get(k) or ""):
                  raise SystemExit(f"::error::unexpected {k}")
          env = {
              "SLOP_EXEC": exec_,
              "SLOP_ARGS": json.dumps(b.get("args") or [], separators=(",", ":")),
              "SLOP_RUNTIMES": json.dumps(b.get("runtimes"), separators=(",", ":")),
              "SLOP_DEB_DEPENDS": b.get("deb_depends") or "",
              "SLOP_RPM_REQUIRES": b.get("rpm_requires") or "",
          }
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              for k, v in env.items():
                  if "\n" in v or "\r" in v:
                      raise SystemExit(f"::error::{k} isn't one line")
                  if v:
                      fh.write(f"{k}={v}\n")
          PY
          rm -f slop-dist/app.tar slop-dist/build.json
          [ -f "slop-dist/app/$SLOP_EXEC" ] || { echo "::error::the build has no $SLOP_EXEC"; exit 1; }

      # Optional: sign the Windows program with the maker's SignPath Foundation certificate (free
      # for open-source projects). SignPath checks the build came from this repository on GitHub's
      # runners, signs the files the project's artifact configuration names, and hands the folder back.
      - name: Upload for signing (SignPath)
        id: unsigned
        if: matrix.platform == 'windows' && inputs.signpath-organization-id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slop-unsigned-windows
          path: slop-dist/app
          retention-days: 1

      - name: Sign (SignPath)
        if: matrix.platform == 'windows' && inputs.signpath-organization-id != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ inputs.signpath-organization-id }}
          project-slug: ${{ inputs.signpath-project-slug != '' && inputs.signpath-project-slug || inputs.app }}
          signing-policy-slug: ${{ inputs.signpath-signing-policy-slug }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Room to approve the request in SignPath if your signing policy asks for that.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: slop-dist/signed

      - name: Use the signed files
        if: matrix.platform == 'windows' && inputs.signpath-organization-id != ''
        run: |
          [ -f "slop-dist/signed/$SLOP_EXEC" ] || { echo "::error::SignPath's signed files don't include $SLOP_EXEC"; exit 1; }
          rm -rf slop-dist/app && mv slop-dist/signed slop-dist/app

      - name: Package
        env:
          APP: ${{ inputs.app }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p slop-dist/out
          python3 - <<'PY'
          # Windows: a .zip. Linux: a .tar.gz. Both keep the program's execute permission.
          import json, os, stat, tarfile, zipfile
          app, platform, version, exe = (os.environ[k] for k in ("APP", "PLATFORM", "VERSION", "SLOP_EXEC"))
          root = os.path.join("slop-dist", "app")
          entries = []
          for folder, _, files in os.walk(root):
              for f in sorted(files):
                  path = os.path.join(folder, f)
                  rel = os.path.relpath(path, root).replace(os.sep, "/")
                  if os.path.islink(path):
                      raise SystemExit(f"::error::symbolic links can't be shipped: {rel}")
                  mode = 0o755 if (rel == exe or os.stat(path).st_mode & stat.S_IXUSR) else 0o644
                  entries.append((path, rel, mode))
          if platform == "windows":
              name = f"{app}-{version}-windows.zip"
              with zipfile.ZipFile(os.path.join("slop-dist", "out", name), "w", zipfile.ZIP_DEFLATED) as z:
                  for path, rel, mode in entries:
                      info = zipfile.ZipInfo.from_file(path, rel)
                      info.external_attr = (stat.S_IFREG | mode) << 16
                      with open(path, "rb") as fh:
                          z.writestr(info, fh.read(), zipfile.ZIP_DEFLATED)
          else:
              name = f"{app}-{version}-linux-x86_64.tar.gz"
              with tarfile.open(os.path.join("slop-dist", "out", name), "w:gz", format=tarfile.PAX_FORMAT) as t:
                  for path, rel, mode in entries:
                      info = t.gettarinfo(path, rel)
                      info.mode, info.uid, info.gid, info.uname, info.gname = mode, 0, 0, "", ""
                      with open(path, "rb") as fh:
                          t.addfile(info, fh)
          files = [{"platform": platform, "file_name": name, "exec": exe, "args": json.loads(os.environ.get("SLOP_ARGS") or "[]")}]
          if platform == "windows":
              files[0]["runtimes"] = json.loads(os.environ.get("SLOP_RUNTIMES") or "null")
          with open(os.path.join("slop-dist", "files.json"), "w") as fh:
              json.dump(files, fh)
          print(f"packed {name}")
          PY

      # Microsoft Defender, on GitHub's Windows runner with today's definitions: what players'
      # Windows would say about this build, found before it's published. Cloud lookups are on, as
      # on players' PCs, but samples are never uploaded. A detection doesn't stop the build: Slop
      # holds the release for a person to look at (it may be a false positive).
      - name: Check with Microsoft Defender
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Update-MpSignature
          Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent NeverSend
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $files = Get-ChildItem slop-dist/out -Filter *.zip | Select-Object -First 1
          $app = (Resolve-Path slop-dist/app).Path
          $out = & $mp -Scan -ScanType 3 -File $app -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 2) { throw "Defender couldn't scan (exit $code): $out" }
          $detections = @()
          $threat = $null
          foreach ($line in $out -split "`r?`n") {
            if ($line -match '^\s*Threat\s*:\s*(.+)$') { $threat = $Matches[1].Trim() }
            elseif ($line -match '^\s*file\s*:\s*(.+)$' -and $threat) {
              $detections += @{ file = $Matches[1].Trim().Replace("$app\", '').Replace('\', '/'); threat = $threat }
            }
          }
          $status = Get-MpComputerStatus
          $sig = Get-AuthenticodeSignature (Join-Path $app $env:SLOP_EXEC)
          $signer = $null
          if ($sig.Status -eq 'Valid') { $signer = ($sig.SignerCertificate.Subject -split ',')[0] -replace '^CN=', '' }
          $report = [ordered]@{
            sha256 = (Get-FileHash $files.FullName -Algorithm SHA256).Hash.ToLower()
            engine = $status.AMEngineVersion
            signatures = $status.AntivirusSignatureVersion
            signatures_updated = $status.AntivirusSignatureLastUpdated.ToString('o')
            detections = @($detections)
            signed_by = $signer
          }
          $report | ConvertTo-Json -Depth 4 | Set-Content slop-dist/defender.json
          if ($detections.Count -gt 0) {
            foreach ($d in $detections) { echo "::warning title=Microsoft Defender flags $($d.file)::$($d.threat). Slop holds the release for a person to look at. If it's a false positive, submit the file at https://www.microsoft.com/en-us/wdsi/filesubmission (as a software developer); signing with SignPath helps most." }
          } else {
            echo "Microsoft Defender $($status.AMEngineVersion), definitions $($status.AntivirusSignatureVersion): nothing found."
          }
          if (-not $signer) { echo "::notice title=Unsigned Windows program::$env:SLOP_EXEC isn't signed. Windows trusts signed programs more; open-source projects can sign for free with SignPath Foundation (see Slop's publishing guide)." }

      - name: Add Defender's check to the files
        if: matrix.platform == 'windows'
        run: |
          jq --slurpfile d slop-dist/defender.json '(.[] | select(.platform == "windows")) += {defender: $d[0]}' slop-dist/files.json > f
          mv f slop-dist/files.json

      - name: Linux packages (.deb, .rpm)
        if: matrix.platform == 'linux'
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGES: ${{ inputs.linux-packages }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # The app goes in /opt/<app>, with /usr/bin/<app> starting it.
          [[ "$PACKAGES" =~ ^((deb|rpm)(,(deb|rpm))*)?$ ]] || { echo "::error::linux-packages takes deb and/or rpm"; exit 1; }
          # Package versions must start with a digit (build.12 becomes 0.0~build.12).
          pkgver="$VERSION"; [[ "$pkgver" =~ ^[0-9] ]] || pkgver="0.0~$pkgver"
          stage=$(mktemp -d)
          chmod 755 "$stage"
          mkdir -p "$stage/opt/$APP" "$stage/usr/bin"
          cp -R slop-dist/app/. "$stage/opt/$APP/"
          chmod -R u+rwX,go+rX,go-w "$stage/opt"
          chmod 755 "$stage/opt/$APP/$SLOP_EXEC"
          ln -s "/opt/$APP/$SLOP_EXEC" "$stage/usr/bin/$APP"
          if [[ ",$PACKAGES," == *",deb,"* ]]; then
            mkdir -p "$stage/DEBIAN"
            printf 'Package: %s\nVersion: %s\nArchitecture: amd64\nMaintainer: %s\nHomepage: %s\nDescription: %s, built by Slop Build\n' \
              "$APP" "$pkgver" "$GITHUB_REPOSITORY_OWNER" "$REPO_URL" "$APP" > "$stage/DEBIAN/control"
            [ -n "${SLOP_DEB_DEPENDS:-}" ] && echo "Depends: $SLOP_DEB_DEPENDS" >> "$stage/DEBIAN/control"
            # File names use the plain version: GitHub renames uploads with characters like "~".
            name="${APP}_${VERSION}_amd64.deb"
            dpkg-deb --root-owner-group --build "$stage" "slop-dist/out/$name"
            rm -rf "$stage/DEBIAN"
            jq --arg n "$name" '. + [{"platform": "linux-deb", "file_name": $n}]' slop-dist/files.json > f && mv f slop-dist/files.json
          fi
          if [[ ",$PACKAGES," == *",rpm,"* ]]; then
            command -v rpmbuild >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rpm; }
            rpmver="${pkgver//-/_}"; rpmver="${rpmver//\~/_}"
            top=$(mktemp -d)
            cat > "$top/app.spec" <<SPEC
          Name: $APP
          Version: $rpmver
          Release: 1
          Summary: $APP, built by Slop Build
          License: see $REPO_URL
          URL: $REPO_URL
          AutoReqProv: no
          ${SLOP_RPM_REQUIRES:+Requires: $SLOP_RPM_REQUIRES}
          %description
          $APP, built by Slop Build from $REPO_URL.
          %install
          cp -a $stage/. %{buildroot}/
          %files
          /opt/$APP
          /usr/bin/$APP
          SPEC
            rpmbuild -bb --define "_topdir $top" --define "_build_id_links none" --target x86_64 "$top/app.spec"
            name="${APP}-${VERSION}.x86_64.rpm"
            cp "$top/RPMS/x86_64/${APP}-${rpmver}-1.x86_64.rpm" "slop-dist/out/$name"
            jq --arg n "$name" '. + [{"platform": "linux-rpm", "file_name": $n}]' slop-dist/files.json > f && mv f slop-dist/files.json
          fi
          ls -l slop-dist/out

      # GitHub release files are limited to 2 GiB: a bigger archive goes up in numbered parts
      # (name.001, name.002, …), each signed and checked on its own; the desktop app downloads
      # them in order, checks each, and joins them back into the archive Slop checked.
      - name: Split files over 2 GiB
        run: |
          python3 - <<'PY'
          import json, os
          LIMIT = 2_000_000_000
          out = os.path.join("slop-dist", "out")
          path = os.path.join("slop-dist", "files.json")
          files = json.load(open(path))
          for f in files:
              src = os.path.join(out, f["file_name"])
              size = os.path.getsize(src)
              if size <= LIMIT:
                  continue
              if f["platform"] in ("linux-deb", "linux-rpm"):
                  raise SystemExit(f"::error::{f['file_name']} is over 2 GiB, which GitHub releases can't hold. Turn off linux-packages for this app; the .tar.gz is split into parts instead.")
              count = -(-size // LIMIT)
              if count > 64:
                  raise SystemExit(f"::error::{f['file_name']} is over 128 GB, more than Slop takes.")
              parts = []
              with open(src, "rb") as fh:
                  for n in range(1, count + 1):
                      name = f"{f['file_name']}.{n:03}"
                      with open(os.path.join(out, name), "wb") as part:
                          left = LIMIT
                          while left:
                              chunk = fh.read(min(left, 1 << 24))
                              if not chunk:
                                  break
                              part.write(chunk)
                              left -= len(chunk)
                      parts.append(name)
              os.remove(src)
              f["parts"] = parts
              print(f"{f['file_name']}: {size} bytes in {count} parts")
          json.dump(files, open(path, "w"))
          PY

      - name: Sign (maker's attestation)
        if: inputs.sign && inputs.publish
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: slop-dist/out/*

      - name: Attach to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" slop-dist/out/* --repo "$GITHUB_REPOSITORY" --clobber

      # itch.io: the same files, pushed with itch's own tool (butler, pinned and checked).
      - name: Push to itch.io
        if: inputs.publish && inputs.itch-target != ''
        env:
          ITCH: ${{ inputs.itch-target }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          [[ "$ITCH" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]] || { echo "::error::itch-target is user/game, from your page's address"; exit 1; }
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::itch-target needs the BUTLER_API_KEY secret (itch.io → Settings → API keys)"; exit 1; }
          python3 - "$PLATFORM" "$RUNNER_TEMP/butler" <<'PY'
          import hashlib, sys, urllib.request, zipfile, io, os
          platform, dest = sys.argv[1:3]
          # butler 15.32.0 from itch.io, checked against the hash Slop recorded.
          builds = {
              "linux": ("linux-amd64", "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5"),
              "windows": ("windows-amd64", "5902c488b86bb3518ca00bf4e706d7687f229e3f0f28653cd943348ea9ec8878"),
          }
          os_name, sha = builds[platform]
          data = urllib.request.urlopen(f"https://broth.itch.zone/butler/{os_name}/15.32.0/archive/default").read()
          if hashlib.sha256(data).hexdigest() != sha:
              raise SystemExit("::error::butler's download doesn't match the expected hash; not running it")
          zipfile.ZipFile(io.BytesIO(data)).extractall(dest)
          PY
          butler="$RUNNER_TEMP/butler/butler"; [ "$PLATFORM" = windows ] && butler="$butler.exe"
          chmod +x "$butler" 2>/dev/null || true
          "$butler" push slop-dist/app "$ITCH:$PLATFORM" --userversion "$VERSION"

      # A draft Flatpak manifest for the Linux build, for the maker to finish and send to Flathub.
      - name: Draft Flatpak manifest
        if: inputs.publish && inputs.flatpak-app-id != '' && matrix.platform == 'linux'
        env:
          APP: ${{ inputs.app }}
          APP_ID: ${{ inputs.flatpak-app-id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$APP_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_-]+){2,}$ ]] || { echo "::error::flatpak-app-id is reverse-DNS, e.g. io.github.you.Game"; exit 1; }
          python3 - <<'PY' > "slop-dist/$APP_ID.yml"
          import glob, hashlib, json, os
          app, app_id, tag, version = (os.environ[k] for k in ("APP", "APP_ID", "TAG", "VERSION"))
          archive = glob.glob(f"slop-dist/out/{app}-{version}-linux-x86_64.tar.gz")[0]
          name = os.path.basename(archive)
          sha = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}"
          exe = os.environ["SLOP_EXEC"]
          print(f"""# Draft made by Slop Build for {app} {version}. Check the permissions (finish-args),
          # add a metainfo file with screenshots, and follow https://docs.flathub.org/docs/for-app-authors/submission
          app-id: {app_id}
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: {app}
          finish-args:
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --socket=pulseaudio
            - --device=dri
            # - --share=network   # only if it goes online
          modules:
            - name: {app}
              buildsystem: simple
              build-commands:
                - mkdir -p /app/lib/{app} /app/bin
                - cp -r . /app/lib/{app}/
                - printf '#!/bin/sh\\nexec /app/lib/{app}/{exe} "$@"\\n' > /app/bin/{app}
                - chmod +x /app/bin/{app}
              sources:
                - type: archive
                  url: {url}
                  sha256: {sha}
                  strip-components: 0
          """)
          PY
          gh release upload "$TAG" "slop-dist/$APP_ID.yml" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the build (build and check only)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slop-build-${{ matrix.platform }}
          path: slop-dist/out
          retention-days: 1

      - name: Describe the files for Slop
        env:
          PLATFORM: ${{ matrix.platform }}
        run: mv slop-dist/files.json "slop-dist/$PLATFORM.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slop-file-${{ matrix.platform }}
          path: slop-dist/${{ matrix.platform }}.json
          retention-days: 1

  source-checks:
    name: Check the source
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # Leaked keys and tokens (gitleaks), and dependencies with known vulnerabilities (OSV).
      # Findings go to Slop for the maker and the reviewer; secrets' values are never sent.
      - name: Secrets and dependencies
        run: |
          mkdir -p slop-checks
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/slop-checks:/out" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /src --no-banner --redact --exit-code 0 --report-format json --report-path /out/gitleaks.json || true
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/slop-checks:/out" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source -r /src --format json --output /out/osv.json || true
          python3 - <<'PY' > slop-checks/source.json
          import json, os
          def load(p):
              try:
                  return json.load(open(p))
              except Exception:
                  return None
          leaks = load("slop-checks/gitleaks.json") or []
          secrets = [{"file": l.get("File", "").removeprefix("/src/"), "line": l.get("StartLine"), "rule": l.get("RuleID")} for l in leaks][:100]
          osv = load("slop-checks/osv.json") or {}
          vulns = []
          for r in osv.get("results", []):
              for p in r.get("packages", []):
                  pkg = p.get("package", {})
                  for v in p.get("vulnerabilities", []):
                      vulns.append({"package": pkg.get("name"), "version": pkg.get("version"), "ecosystem": pkg.get("ecosystem"),
                                    "id": v.get("id"), "summary": (v.get("summary") or "")[:200]})
          print(json.dumps({"secrets": secrets, "vulnerabilities": vulns[:200],
                            "tools": {"gitleaks": "8.30.1", "osv-scanner": "2.7.0"},
                            "checked": os.path.exists("slop-checks/gitleaks.json") and os.path.exists("slop-checks/osv.json")}))
          PY
          python3 -c "import json; d=json.load(open('slop-checks/source.json')); print(len(d['secrets']), 'possible secrets,', len(d['vulnerabilities']), 'known vulnerabilities')"
          jq -r '.secrets[] | "\(.file):\(.line) (\(.rule))"' slop-checks/source.json | while IFS= read -r f; do
            echo "::warning title=Possible secret in your repository::$f"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slop-source-checks
          path: slop-checks/source.json
          retention-days: 1

  notify:
    name: Tell Slop
    needs: [prepare, release, source-checks]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: slop-file-*
          merge-multiple: true
          path: slop-files

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slop-source-checks
          path: slop-checks

      - name: Submit the release to Slop
        env:
          APP: ${{ inputs.app }}
          SLOP_URL: ${{ inputs.slop-url }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # GitHub's OIDC token proves this run is this recipe, in this repo, at this commit.
          # Slop checks it; no secret is shared.
          base="${SLOP_URL%/}"
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$base" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$token"
          python3 - <<'PY' > body.json
          import glob, json, os
          files = [f for p in sorted(glob.glob("slop-files/*.json")) for f in json.load(open(p))]
          checks = json.load(open("slop-checks/source.json"))
          body = {"app": os.environ["APP"], "version": os.environ["VERSION"], "tag": os.environ["TAG"],
                  "commit": os.environ["GITHUB_SHA"], "files": files, "source_checks": checks}
          # slop.toml's runtimes travel with the Windows file; Slop takes them for the release.
          runtimes = [f.pop("runtimes", None) for f in files]
          if any(r is not None for r in runtimes):
              body["runtimes"] = next(r for r in runtimes if r is not None)
          print(json.dumps(body))
          PY
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$base/v1/slop-build/releases" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data @body.json)
          cat response.json; echo
          if [ "$status" -ge 300 ]; then
            echo "::error::Slop refused the release (HTTP $status). See the response above."
            exit 1
          fi
          echo "Submitted to Slop. It's checked and reviewed before players get it."
