[package]
name = "slop-source-scan"
version = "0.1.0"
description = "SLAPorSLOP's source check: reads a repository archive or a checked-out tree for licence, monetization, code-loading, networking and package notes"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"
authors.workspace = true
# The scanner image builds it with Debian stable's own Rust (deploy/scanner/Containerfile).
rust-version = "1.85"

# Runs on makers' GitHub runners (the Slop Build recipe's `source-checks` job), inside
# SLAPorSLOP's scanner image: prints what it found as JSON for the server.
[[bin]]
name = "slop-source-check"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
