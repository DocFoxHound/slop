[package]
name = "slop-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
minisign = "0.10.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slop-manifest = { version = "0.1.0", path = "../slop-manifest" }
slop-provenance = { version = "0.1.0", path = "../slop-provenance" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit", "timeout", "request-id", "util", "csrf", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
minisign-verify = "0.3"
semver = "1.0.28"
sha2 = "0.11.1"
slop-client = { path = "../slop-client" }
slop-manifest = { path = "../slop-manifest" }
