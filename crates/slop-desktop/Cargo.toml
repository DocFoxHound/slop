[package]
name = "slop-desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slop-client = { version = "0.1.0", path = "../slop-client", features = ["os-keyring"] }
tauri = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# No "zip": Windows updates are a signed installer and Linux updates are packages, so the
# updater never unpacks archives (it would for macOS bundles; macOS is not built yet).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1.53.3", features = ["rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde"] }
base64 = "0.23.1"

# The tray (close to tray) is Windows-only: on Linux it needs an appindicator library.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# The in-game overlay finds the window in front (overlay.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[build-dependencies]
tauri-build = "2"
