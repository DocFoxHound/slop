[package]
name = "slop-desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slop-client = { version = "0.1.0", path = "../slop-client", features = ["os-keyring"] }
tauri = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.3", features = ["rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[build-dependencies]
tauri-build = "2"
