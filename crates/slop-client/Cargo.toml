[package]
name = "slop-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.23.1"
chacha20poly1305 = "0.10"
flate2 = "1"
hex = "0.4.3"
hmac = "0.13.0"
keyring = { version = "4.2.0", optional = true }
openmls = "0.9.1"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slop-manifest = { version = "0.1.0", path = "../slop-manifest" }
slop-provenance = { version = "0.1.0", path = "../slop-provenance" }
tar = "0.4"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "fs", "sync", "time", "macros", "process"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Sandbox mode on Windows: AppContainers, file permissions and job objects (appcontainer.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
flate2 = "1"
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[features]
# Keep the refresh token in the OS secure store (Keychain, Credential Manager, Secret Service).
os-keyring = ["dep:keyring"]
