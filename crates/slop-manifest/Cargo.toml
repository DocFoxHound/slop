[package]
name = "slop-manifest"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }

[dev-dependencies]
rand = "0.10.3"
