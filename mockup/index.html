<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window" id="window">
    <!-- Fake native title bar - changes with the OS switch -->
    <div class="titlebar">
      <div class="mac-ctrls"><i></i><i></i><i></i></div>
      <div class="tb-title"><svg viewBox="0 0 32 32"><use href="#logo"/></svg>Slop</div>
      <div class="grow"></div>
      <div class="os-switch" id="os-switch" title="This mockup pretends to be the desktop app. Switch OS to see how downloads change.">
        <span>Preview as</span>
        <button data-os="windows"><svg><use href="#i-windows"/></svg>Windows</button>
        <button data-os="mac"><svg><use href="#i-mac"/></svg>macOS</button>
        <button data-os="linux"><svg><use href="#i-linux"/></svg>Linux</button>
        <i class="sep"></i>
        <button data-os="ios"><svg><use href="#i-ios"/></svg>iOS</button>
        <button data-os="android"><svg><use href="#i-android"/></svg>Android</button>
      </div>
      <div class="win-ctrls"><i>—</i><i>☐</i><i>✕</i></div>
      <div class="linux-ctrls"><i>—</i><i>✕</i></div>
    </div>

    <nav class="nav">
      <a class="logo" href="#/"><svg viewBox="0 0 32 32"><use href="#logo"/></svg><span>SL<b>O</b>P</span></a>
      <div class="tabs" id="tabs">
        <a href="#/" data-tab="store">STORE</a>
        <a href="#/library" data-tab="library">LIBRARY</a>
        <a href="#/teams" data-tab="teams">TEAMS</a>
        <a href="#/humans" data-tab="humans">HUMANS</a>
        <a href="#/publish" data-tab="publish">PUBLISH</a>
        <a href="#/rules" data-tab="rules">RULES</a>
      </div>
      <div class="grow"></div>
      <form class="search" id="search"><input type="search" placeholder="Search apps, games, tags…" aria-label="Search"></form>
      <div class="me" id="me"></div>
    </nav>

    <main class="view" id="view"></main>
    <!-- Phone-style tab bar, shown only when the window is phone-sized -->
    <nav class="bottom-tabs" id="bottom-tabs">
      <a href="#/" data-tab="store"><span>🛒</span>Store</a>
      <a href="#/library" data-tab="library"><span>📚</span>Library</a>
      <a href="#/teams" data-tab="teams"><span>👥</span>Teams</a>
      <a href="#/humans" data-tab="humans"><span>🙋</span>Humans</a>
      <a href="#/publish" data-tab="publish"><span>⬆️</span>Publish</a>
      <a href="#/rules" data-tab="rules"><span>📜</span>Rules</a>
    </nav>
    <div class="toasts" id="toasts"></div>
  </div>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="logo" viewBox="0 0 32 32">
        <path d="M4 9c0-3 2.5-5 6-5h12c3.5 0 6 2 6 5v4c0 2-1.2 3-2.5 3S23 17 23 19v5c0 2-1.3 3.5-3 3.5S17 26 17 24v-2.5c0-1.4-.9-2.3-2-2.3s-2 .9-2 2.3v1c0 1.6-1.2 2.8-2.7 2.8S7.5 24.1 7.5 22.5V19c0-1.5-.8-2.5-1.8-2.8C4.7 15.9 4 15 4 13.5z" fill="#a3e635"/>
        <circle cx="12" cy="10.5" r="2" fill="#1a2e05"/><circle cx="20" cy="10.5" r="2" fill="#1a2e05"/>
      </symbol>
      <symbol id="i-windows" viewBox="0 0 16 16"><path fill="currentColor" d="M1 2.5 6.6 1.7v5.6H1zm6.4-.9L15 .5v6.8H7.4zM1 8.1h5.6v5.6L1 12.9zm6.4 0H15v6.9l-7.6-1.1z"/></symbol>
      <symbol id="i-mac" viewBox="0 0 16 16"><path fill="currentColor" d="M11.2 8.5c0-1.6 1.3-2.4 1.4-2.4-.8-1.1-2-1.3-2.4-1.3-1-.1-2 .6-2.5.6s-1.3-.6-2.2-.6C4.4 4.8 3.3 5.5 2.7 6.6c-1.2 2.1-.3 5.2.9 6.9.6.8 1.2 1.7 2.1 1.7.8 0 1.2-.6 2.2-.6s1.3.6 2.2.5c.9 0 1.5-.8 2-1.7.6-.9.9-1.8.9-1.9-.1 0-1.8-.7-1.8-3zM9.6 3.6c.4-.6.8-1.3.7-2.1-.7 0-1.5.5-2 1-.4.5-.8 1.3-.7 2.1.8.1 1.5-.4 2-1z"/></symbol>
      <symbol id="i-ios" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6.5" y="2.6" width="3" height=".9" rx=".45" fill="currentColor"/></symbol>
      <symbol id="i-android" viewBox="0 0 16 16"><path fill="currentColor" d="M3 7.2c0-2.6 2.2-4.6 5-4.6s5 2 5 4.6V8H3zM5.6 5.4a.6.6 0 1 0 0-1.2.6.6 0 0 0 0 1.2zm4.8 0a.6.6 0 1 0 0-1.2.6.6 0 0 0 0 1.2zM4.3 2.1l.9 1.4m6.5-1.4-.9 1.4" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/><rect x="3" y="8.7" width="10" height="5.3" rx="1.3" fill="currentColor"/></symbol>
      <symbol id="i-linux" viewBox="0 0 16 16"><path fill="currentColor" d="M8 .8c-1.8 0-2.7 1.5-2.7 3.4 0 .9.2 1.5-.4 2.4C4 8 3 9.6 3 11.3c0 .5.1.9.3 1.2-.6.3-1.4.5-1.4 1.1 0 .8 1.5.9 2.8 1.4.9.3 1.4-.3 1.5-.6h3.6c.1.3.6.9 1.5.6 1.3-.5 2.8-.6 2.8-1.4 0-.6-.8-.8-1.4-1.1.2-.3.3-.7.3-1.2 0-1.7-1-3.3-1.9-4.7-.6-.9-.4-1.5-.4-2.4C10.7 2.3 9.8.8 8 .8zm-1.2 3c.4 0 .6.4.6.8s-.2.7-.5.7-.6-.3-.6-.7.2-.8.5-.8zm2.4 0c.3 0 .5.4.5.8s-.2.7-.6.7-.5-.3-.5-.7.2-.8.6-.8zM8 5.6c.6 0 1.4.4 1.4.7S8.6 7 8 7s-1.4-.4-1.4-.7.8-.7 1.4-.7zM8 8c1.4 0 2.4 1.5 2.4 3.4 0 .9-.5 1.5-1 1.9H6.6c-.5-.4-1-1-1-1.9C5.6 9.5 6.6 8 8 8z"/></symbol>
    </defs>
  </svg>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
