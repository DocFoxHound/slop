<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Slop or Not Slop</title>
  <desc id="d">An app's rating: 96% Not Slop from players who launched it, weighted by playtime, with a chart showing the rating rising from 54% to 96% as updates shipped.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- A simple thumb, pointing up. -->
    <path id="thumbup" d="M4 11h4v10H4zM10 11l4-8c1.7 0 3 1.3 3 3v4h4.2c1.3 0 2.2 1.2 1.9 2.4l-1.8 7c-.2.9-1 1.6-2 1.6H10z"/>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>

  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- The vote panel -->
    <g transform="translate(48 48)" filter="url(#shadow)">
      <rect width="440" height="364" rx="18" fill="#151a21" stroke="#2a333f"/>
      <rect x="24" y="24" width="64" height="64" rx="14" fill="url(#thumb)"/>
      <g transform="translate(40 34)">
        <rect x="8" y="0" width="16" height="6" rx="2" fill="#1a1205"/>
        <rect x="2" y="6" width="28" height="30" rx="7" fill="#fde68a"/>
        <rect x="6" y="36" width="20" height="6" rx="2" fill="#1a1205"/>
      </g>
      <text x="104" y="52" font-size="24" font-weight="800" fill="#e7ecf2">Lantern Keep</text>
      <text x="104" y="78" font-size="15" fill="#8d99a8">by Mia Maker · Puzzle</text>

      <text x="24" y="160" font-size="64" font-weight="900" fill="#a3e635">96%</text>
      <text x="168" y="138" font-size="22" font-weight="800" fill="#a3e635">Not Slop</text>
      <text x="168" y="162" font-size="15" fill="#c4ced9">Overwhelmingly Not Slop</text>
      <text x="24" y="196" font-size="15" fill="#8d99a8">2,914 votes · weighted by playtime</text>

      <!-- buttons -->
      <g transform="translate(24 222)">
        <rect width="190" height="54" rx="12" fill="#a3e635"/>
        <use href="#thumbup" transform="translate(22 13) scale(1.15)" fill="#1a2e05"/>
        <text x="62" y="34" font-size="19" font-weight="800" fill="#1a2e05">Not Slop</text>
      </g>
      <g transform="translate(226 222)">
        <rect width="190" height="54" rx="12" fill="#242c37" stroke="#2a333f"/>
        <use href="#thumbup" transform="translate(48 41) scale(1.15 -1.15)" fill="#f87171"/>
        <text x="86" y="34" font-size="19" font-weight="800" fill="#e7ecf2">Slop</text>
      </g>
      <text x="24" y="318" font-size="14" fill="#8d99a8">Only people who launched it through Slop can vote.</text>
      <text x="24" y="340" font-size="14" fill="#8d99a8">One vote per account, and you can change it any time.</text>
    </g>

    <!-- The chart -->
    <g transform="translate(528 48)">
      <text x="0" y="22" font-size="13" font-weight="800" fill="#8d99a8" letter-spacing="2">% NOT SLOP, MONTH BY MONTH</text>
      <!-- grid -->
      <g stroke="#242c37" stroke-width="1">
        <line x1="0" y1="60" x2="620" y2="60"/>
        <line x1="0" y1="150" x2="620" y2="150"/>
        <line x1="0" y1="240" x2="620" y2="240"/>
        <line x1="0" y1="330" x2="620" y2="330"/>
      </g>
      <g font-size="12" fill="#808b9b" text-anchor="end">
        <text x="-8" y="64">100%</text>
        <text x="-8" y="154">75%</text>
        <text x="-8" y="244">50%</text>
        <text x="-8" y="334">25%</text>
      </g>
      <!-- 54 → 58 → 71 → 78 → 90 → 93 → 96 ; y = 60 + (100 - v) * 3.6 -->
      <path d="M0 225.6 L100 211.2 L200 164.4 L300 139.2 L400 96 L500 85.2 L600 74.4 L600 330 L0 330 Z" fill="url(#area)"/>
      <path d="M0 225.6 L100 211.2 L200 164.4 L300 139.2 L400 96 L500 85.2 L600 74.4" fill="none" stroke="#a3e635" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#0d1015" stroke="#a3e635" stroke-width="3">
        <circle cx="0" cy="225.6" r="6"/><circle cx="100" cy="211.2" r="6"/><circle cx="200" cy="164.4" r="6"/>
        <circle cx="300" cy="139.2" r="6"/><circle cx="400" cy="96" r="6"/><circle cx="500" cy="85.2" r="6"/>
        <circle cx="600" cy="74.4" r="7" fill="#a3e635"/>
      </g>
      <!-- update notes -->
      <g font-size="13">
        <line x1="200" y1="164" x2="200" y2="276" stroke="#2a333f" stroke-dasharray="4 4"/>
        <rect x="128" y="276" width="146" height="44" rx="8" fill="#1c232c" stroke="#2a333f"/>
        <text x="140" y="296" fill="#e7ecf2" font-weight="700">v1.1</text>
        <text x="140" y="313" fill="#8d99a8">Bug fixes from players</text>
        <line x1="400" y1="96" x2="400" y2="210" stroke="#2a333f" stroke-dasharray="4 4"/>
        <rect x="318" y="210" width="166" height="44" rx="8" fill="#1c232c" stroke="#2a333f"/>
        <text x="330" y="230" fill="#e7ecf2" font-weight="700">v1.3</text>
        <text x="330" y="247" fill="#8d99a8">New art by a hired artist</text>
      </g>
      <g font-size="12" fill="#808b9b" text-anchor="middle">
        <text x="0" y="356">May</text><text x="100" y="356">Jun</text><text x="200" y="356">Jul</text><text x="300" y="356">Aug</text>
        <text x="400" y="356">Sep</text><text x="500" y="356">Oct</text><text x="600" y="356">Nov</text>
      </g>
      <text x="0" y="398" font-size="15" fill="#c4ced9">Updates, fixes and community branches show up in the rating.</text>
    </g>
  </g>
</svg>
