      <path d="M0 16a16 16 0 0 1 16-16h178a16 16 0 0 1 16 16v114h-210z" fill="url(#c2)"/>
      <path d="M110 70 L200 40 M90 90 L200 60" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
      <text x="20" y="112" font-size="21" font-weight="800" fill="#fff">Neon Drift</text>
      <text x="20" y="160" font-size="14" fill="#8d99a8">Racing · Arcade</text>
      <text x="20" y="208" font-size="30" font-weight="900" fill="#f87171">23%</text>
      <text x="90" y="208" font-size="15" font-weight="700" fill="#f87171">Slop</text>
      <text x="20" y="234" font-size="13" fill="#8d99a8">Mostly Slop · 412 votes</text>
      <rect x="20" y="252" width="170" height="8" rx="4" fill="#242c37"/>
      <rect x="20" y="252" width="39" height="8" rx="4" fill="#f87171"/>
    </g>
    <g transform="translate(838 72) rotate(-1)" filter="url(#shadow)">
      <rect width="210" height="280" rx="16" fill="#151a21" stroke="#2a333f"/>
      <path d="M0 16a16 16 0 0 1 16-16h178a16 16 0 0 1 16 16v114h-210z" fill="url(#c3)"/>
      <circle cx="150" cy="54" r="26" fill="#fff" opacity="0.18"/>
      <circle cx="132" cy="74" r="8" fill="#fff" opacity="0.9"/>
      <text x="20" y="112" font-size="21" font-weight="800" fill="#fff">Pocket Golf</text>
      <text x="20" y="160" font-size="14" fill="#8d99a8">Sports · Casual</text>
      <text x="20" y="208" font-size="30" font-weight="900" fill="#a3e635">81%</text>
      <text x="90" y="208" font-size="15" font-weight="700" fill="#a3e635">Slaps</text>
      <text x="20" y="234" font-size="13" fill="#8d99a8">Really Slaps · 1,208 votes</text>
      <rect x="20" y="252" width="170" height="8" rx="4" fill="#242c37"/>
      <rect x="20" y="252" width="137" height="8" rx="4" fill="#a3e635"/>
    </g>
    <g transform="translate(632 104) rotate(-6)" filter="url(#shadow)">
      <rect width="210" height="280" rx="16" fill="#151a21" stroke="#a3e635" stroke-opacity="0.6"/>
      <path d="M0 16a16 16 0 0 1 16-16h178a16 16 0 0 1 16 16v114h-210z" fill="url(#c1)"/>
      <g transform="translate(150 22)" opacity="0.95">
        <rect x="8" y="0" width="16" height="6" rx="2" fill="#1a1205"/>
        <rect x="2" y="6" width="28" height="40" rx="8" fill="#fde68a"/>
        <rect x="8" y="12" width="16" height="28" rx="5" fill="#fff7d6"/>
        <rect x="6" y="46" width="20" height="6" rx="2" fill="#1a1205"/>
      </g>
      <text x="20" y="112" font-size="21" font-weight="800" fill="#fff">Lantern Keep</text>
      <text x="20" y="160" font-size="14" fill="#8d99a8">Puzzle · Strategy</text>
      <text x="20" y="208" font-size="30" font-weight="900" fill="#a3e635">96%</text>
      <text x="90" y="208" font-size="15" font-weight="700" fill="#a3e635">Slaps</text>
      <text x="20" y="234" font-size="13" fill="#8d99a8">Overwhelmingly Slaps</text>
      <rect x="20" y="252" width="170" height="8" rx="4" fill="#242c37"/>
      <rect x="20" y="252" width="163" height="8" rx="4" fill="#a3e635"/>
    </g>
  </g>
</svg>
