<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">SLAPorSLOP</title>
  <desc id="d">SLAPorSLOP: the store for apps and games made with AI, rated Slaps or Slop by the people who played them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2a333f"/>
    </pattern>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <g id="logo">
      <path d="M6 3h16.6L28 8.4V21c0 1.1-.9 2-2 2C25.2 23 24.9 23.9 24.9 25v1.5a1.4 1.4 0 0 1-2.8 0V25C22.1 23.9 21.8 23 21 23H17C16.2 23 15.9 24 15.9 25.2v2.4a1.9 1.9 0 0 1-3.8 0v-2.4C12.1 24 11.8 23 11 23H9.6C8.9 23 8.6 23.6 8.6 24.3v.5a1.1 1.1 0 0 1-2.2 0v-.5C6.4 23.4 6 23 5.5 23 4.7 23 4 22.3 4 21.5V5c0-1.1.9-2 2-2z" fill="#a3e635"/>
      <path d="M10 3h11.5v6.4c0 .6-.5 1.1-1.1 1.1h-9.3c-.6 0-1.1-.5-1.1-1.1z" fill="#4d7c0f"/>
      <rect x="17" y="4.4" width="2.6" height="4.6" rx=".5" fill="#1a2e05"/>
      <rect x="7.5" y="13.5" width="17" height="7" rx="1.2" fill="#ecfccb"/>
      <path d="M10 16h12M10 18.2h8" stroke="#84cc16" stroke-width="1" stroke-linecap="round"/>
      <path d="M23.5 29.2c.6.8 1 1.3 1 1.8a1 1 0 0 1-2 0c0-.5.4-1 1-1.8z" fill="#a3e635"/>
    </g>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#dots)" opacity="0.6"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow2)"/>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <use href="#logo" transform="translate(72 92) scale(3.4)"/>
    <text x="196" y="170" font-size="64" font-weight="900" fill="#e7ecf2" letter-spacing="1">SLAP<tspan fill="#a3e635">or</tspan>SLOP</text>
    <text x="76" y="250" font-size="34" font-weight="700" fill="#e7ecf2">The store for apps and games</text>
    <text x="76" y="292" font-size="34" font-weight="700" fill="#e7ecf2">made with <tspan fill="#a3e635">AI</tspan>.</text>
    <text x="76" y="340" font-size="20" fill="#8d99a8">Share what you made. The people who play it decide</text>
    <text x="76" y="368" font-size="20" fill="#8d99a8">if it <tspan fill="#a3e635" font-weight="700">Slaps</tspan> or it's <tspan fill="#f87171" font-weight="700">Slop</tspan>.</text>
  </g>

  <!-- App cards -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(1052 58) rotate(5)" filter="url(#shadow)">
