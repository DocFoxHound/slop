<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Checked before it reaches you</title>
  <desc id="d">How an app gets to a player: the maker pushes open-source code; it's built and signed in CI; Slop scans it with ClamAV, YARA, capa and Microsoft Defender; a person reviews it; and the Slop app verifies every file before installing and at every launch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="1072" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="66" font-size="13" font-weight="800" fill="#8d99a8" letter-spacing="2">EVERY RELEASE, EVERY UPDATE</text>

    <!-- the line through the steps -->
    <line x1="128" y1="170" x2="1072" y2="170" stroke="url(#flow)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path d="M241 160 l10 10 l-10 10" fill="none" stroke="#6fb5f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M477 160 l10 10 l-10 10" fill="none" stroke="#7fcfd0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M713 160 l10 10 l-10 10" fill="none" stroke="#95dc98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M949 160 l10 10 l-10 10" fill="none" stroke="#a8e15a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- step 1: code -->
    <g transform="translate(48 100)" filter="url(#shadow)">
      <rect width="160" height="140" rx="16" fill="#151a21" stroke="#2a333f"/>
      <circle cx="80" cy="50" r="28" fill="#1c232c" stroke="#60a5fa" stroke-width="2"/>
      <text x="80" y="58" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">&lt;/&gt;</text>
      <text x="80" y="102" font-size="16" font-weight="800" fill="#e7ecf2" text-anchor="middle">Open source</text>
      <text x="80" y="122" font-size="13" fill="#8d99a8" text-anchor="middle">The maker pushes</text>
    </g>

    <!-- step 2: built and signed -->
    <g transform="translate(284 100)" filter="url(#shadow)">
      <rect width="160" height="140" rx="16" fill="#151a21" stroke="#2a333f"/>
      <circle cx="80" cy="50" r="28" fill="#1c232c" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M68 50 l8 8 l16 -18" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="102" font-size="16" font-weight="800" fill="#e7ecf2" text-anchor="middle">Built &amp; signed</text>
      <text x="80" y="122" font-size="13" fill="#8d99a8" text-anchor="middle">From source, in CI</text>
    </g>

    <!-- step 3: scanned -->
    <g transform="translate(520 100)" filter="url(#shadow)">
      <rect width="160" height="140" rx="16" fill="#151a21" stroke="#2a333f"/>
      <circle cx="80" cy="50" r="28" fill="#1c232c" stroke="#86efac" stroke-width="2"/>
      <circle cx="76" cy="46" r="10" fill="none" stroke="#86efac" stroke-width="4"/>
      <line x1="83" y1="53" x2="92" y2="62" stroke="#86efac" stroke-width="4" stroke-linecap="round"/>
      <text x="80" y="102" font-size="16" font-weight="800" fill="#e7ecf2" text-anchor="middle">Scanned</text>
      <text x="80" y="122" font-size="13" fill="#8d99a8" text-anchor="middle">Malware &amp; the rules</text>
    </g>

    <!-- step 4: a person -->
    <g transform="translate(756 100)" filter="url(#shadow)">
      <rect width="160" height="140" rx="16" fill="#151a21" stroke="#2a333f"/>
      <circle cx="80" cy="50" r="28" fill="#1c232c" stroke="#bef264" stroke-width="2"/>
      <circle cx="80" cy="42" r="8" fill="#bef264"/>
      <path d="M64 66 a16 13 0 0 1 32 0z" fill="#bef264"/>
      <text x="80" y="102" font-size="16" font-weight="800" fill="#e7ecf2" text-anchor="middle">Reviewed</text>
      <text x="80" y="122" font-size="13" fill="#8d99a8" text-anchor="middle">By a person</text>
    </g>

    <!-- step 5: verified -->
    <g transform="translate(992 100)" filter="url(#shadow)">
      <rect width="160" height="140" rx="16" fill="#151a21" stroke="#a3e635" stroke-opacity="0.7"/>
      <circle cx="80" cy="50" r="28" fill="#a3e635"/>
      <path d="M80 30 l16 6 v12 c0 10 -7 17 -16 20 c-9 -3 -16 -10 -16 -20 v-12z" fill="#1a2e05"/>
      <path d="M73 49 l5 5 l10 -11" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="102" font-size="16" font-weight="800" fill="#e7ecf2" text-anchor="middle">Verified</text>
      <text x="80" y="122" font-size="13" fill="#8d99a8" text-anchor="middle">At install &amp; every launch</text>
    </g>

    <!-- what each step means -->
    <g font-size="13" fill="#8d99a8">
      <text x="48" y="282">Every public app links its code</text>
      <text x="48" y="300">under an open-source licence.</text>
      <text x="284" y="282">Slop Build signs each file in</text>
      <text x="284" y="300">GitHub Actions, from the commit.</text>
      <text x="520" y="282">ClamAV, YARA, capa, Microsoft</text>
      <text x="520" y="300">Defender, licence and loot boxes.</text>
      <text x="756" y="282">Someone at Slop looks at it</text>
      <text x="756" y="300">before it's in the store.</text>
      <text x="992" y="282">Anything that doesn't match</text>
      <text x="992" y="300">what Slop signed won't run.</text>
    </g>

    <text x="48" y="356" font-size="15" fill="#c4ced9">If something bad slips through anyway, Slop can switch it off on every computer.</text>
  </g>
</svg>
