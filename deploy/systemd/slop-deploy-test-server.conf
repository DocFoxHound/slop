# The test server's deploy settings (deploy/README.md, "How changes ship"): every push to dev is
# deployed within minutes, built without the tests (GitHub runs them when main moves forward
# to dev), and then the "Slop Dev" desktop apps are built here for Linux and Windows.
#
# Install as a drop-in, beside any settings already there (such as SLOP_DEPLOY_REMOTE):
#   mkdir -p ~/.config/systemd/user/slop-deploy.service.d
#   cp deploy/systemd/slop-deploy-test-server.conf ~/.config/systemd/user/slop-deploy.service.d/test-server.conf
#   systemctl --user daemon-reload
# Production has its own (deploy/README.md, "Production"); never install this one there.
[Service]
Environment=SLOP_DEPLOY_BRANCH=dev
Environment=SLOP_DEPLOY_MODE=build
Environment="SLOP_DEPLOY_DESKTOP=linux windows"
