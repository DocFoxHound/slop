# The scanning server's deploy settings (deploy/README.md, "Scanning server"): it runs what
# production runs (the `production` tag), only the program and the scanner image.
# deploy/scan-server-setup.sh installs it as a drop-in for slop-deploy.service.
[Service]
Environment=SLOP_DEPLOY_MODE=scanner
Environment=SLOP_DEPLOY_REF=production
Environment=SLOP_DEPLOY_REMOTE=https://github.com/DocFoxHound/slop.git
