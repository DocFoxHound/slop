# The Windows code-signing allowance (docs/CODE-SIGNING.md), read by deploy/signing-allowance.sh,
# which deploy/promote.sh and the pipeline's Windows build run. Azure Artifact Signing's plan allows
# a number of signatures a month; each production release signs eight files (the program, its
# uninstaller, the installer and the installer's five NSIS plugin DLLs), once per approved run attempt
# on main.

# Signatures the Artifact Signing plan allows each billing month (Basic: 5,000).
SIGNING_MONTHLY_LIMIT=5000
# Files signed per release.
SIGNINGS_PER_RELEASE=8
# The day of the month the allowance starts again (the Azure plan's billing day; 1 to 28).
SIGNING_CYCLE_DAY=1
# 1 once the pipeline signs the Windows build with the Azure Artifact Signing certificate. Until
# then the allowance is only reported; from then on promote.sh refuses a release that would go over it
# (--over-allowance to send it anyway) and the pipeline builds that release unsigned.
SIGNING_ON=1
