# The Windows code-signing allowance (docs/CODE-SIGNING.md), read by deploy/signing-allowance.sh,
# which deploy/promote.sh and the pipeline's Windows build run. SSL.com's eSigner plan allows a
# number of signings a month; each production release signs about three files (slop.exe, its
# uninstaller and the installer), and every release pushed to main is built, and so signed, once
# per run attempt, approved or not.

# Signings the eSigner plan allows each billing month (Tier 1: 20).
SIGNING_MONTHLY_LIMIT=20
# Files signed per release.
SIGNINGS_PER_RELEASE=3
# The day of the month the allowance starts again (the eSigner plan's billing day; 1 to 28).
SIGNING_CYCLE_DAY=1
# 1 once the pipeline signs the Windows build with the SSL.com certificate. Until then the
# allowance is only reported; from then on promote.sh refuses a release that would go over it
# (--over-allowance to send it anyway) and the pipeline builds that release unsigned.
SIGNING_ON=0
