[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app needs WebKitGTK and friends on Linux (see README), so plain `cargo build` and
# `cargo test` only cover the API. Build the desktop app with `npm run desktop` in web/.
default-members = ["crates/slop-api", "crates/slop-manifest", "crates/slop-client", "crates/slop-provenance"]

[workspace.package]
edition = "2024"
publish = false
